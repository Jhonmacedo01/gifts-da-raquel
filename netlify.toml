[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/dashboard.html"
  status = 200
