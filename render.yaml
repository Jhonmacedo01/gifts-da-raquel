services:
  - type: web
    name: gifts-da-raquel
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /privacidade
        destination: /privacidade.html
      - type: rewrite
        source: /admin
        destination: /dashboard.html
      - type: rewrite
        source: /admin/dashboard
        destination: /dashboard.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://hbjckqpqewyyejkfzowg.supabase.co wss://hbjckqpqewyyejkfzowg.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/css/*
        name: Content-Type
        value: text/css; charset=utf-8
